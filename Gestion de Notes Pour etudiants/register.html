<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        <link rel="stylesheet" href="assets/css/style.css">
        <title>Register</title>
    </head>
    <body>
        <div class="registerConteneur">
            <div>
                <img src="assets/images/photoRegister.jpg" alt="" style="width: 800px;height: 100vh;">
            </div>
            <form action="" id="registerForm">
                <img src="assets/images/logo.png" alt="" style="width: 60px; border-radius: 100%;"> <br>
                <h1 id="loginH1"><i class="fa-solid fa-house-user" id="loginHome"></i> INSCRIPTION</h1> <br>
                <div class="login">
                    <i class="fa-solid fa-user-large"></i>
                    <input type="text" placeholder="Entrer votre nom" class="loginInput">
                </div> <br>
                <div class="login">
                    <i class="fa-solid fa-user-large"></i>
                    <input type="text" placeholder="Entrer votre prenom" class="loginInput">
                </div> <br>
                <div class="login">
                    
                    <input type="text" placeholder="Entrer votre age" class="loginInput">
                </div> <br>
                <div class="login">
                    Selectionner votre genre :  <select name="" id="">
                        <option value="">MASCULIN</option>
                        <option value="">FEMININ</option>
                    </select>
                </div> <br>
                <div class="login">
                    <i class="fa-solid fa-key"></i>
                    <input type="text" placeholder="Entrer votre matricule" class="loginInput">
                </div> <br>
                <div class="login">
                    <input type="file"  class="loginInput">
                </div> <br>
                <button type="submit" class="btn btn-success">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    INSCRIPTION
                </button> <br>
                <span class="loginSpan">
                    vous avez déjà un compte?
                    <a href="" class="loginA">
                        Connectez-vous
                    </a>
                </span>
                <div class="loginIcon">
                    <br>
                    <i class="fa-brands fa-facebook-f"></i> &nbsp;
                    <i class="fa-brands fa-instagram"></i> &nbsp;
                    <i class="fa-brands fa-twitter"></i> 
                </div>
            </form>
        </div>
    </body>
</html>
